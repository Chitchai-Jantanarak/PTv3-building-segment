name: mae
stage: 0
model: mae
freeze_encoder: false

masking:
  type: block
  ratio: 0.5
  block_size: 8

loss:
  type: mse
  target: all
  feature_weights:
    x: 1.0
    y: 1.0
    z: 1.0
    rel_z: 1.0
    r: 2.0
    g: 2.0
    b: 2.0
    intensity: 1.0
  priority_multipliers:
    r: 1.5
    g: 1.5
    b: 1.5
    intensity: 1.5
  calibrate: false
  calibration_steps: 200

features:
  xyz: true
  relz: true
  rgb: true
  intensity: auto

color_decoder:
  k: 8
  block_size: 0.05
  chunk_size: 8192

intensity_norm:
  mean: 0.5
  std: 0.5

n_heads: 8

optimizer:
  type: adamw
  lr: 1e-4
  # encoder_lr: 5e-5
  # head_lr: 3e-4
  weight_decay: 0.05

scheduler:
  type: cosine
  warmup_epochs: 10

precision: bf16
epochs: 150
batch_size: 4
num_workers: 4
max_batch_points: 300000
