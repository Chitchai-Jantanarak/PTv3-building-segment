# SEG-A 3-class probe (A/B/C). name stays seg_a so dispatch + dataset + eval paths are reused.
# Run with data.num_classes=3 and a separate paths.ckpt_root so the 13-class checkpoint is never overwritten:
#   A (real labels):    python main.py task=seg_a3 data.num_classes=3 paths.ckpt_root=checkpoints/probe_A
#   B (teacher labels): python main.py task=seg_a3 data.num_classes=3 paths.ckpt_root=checkpoints/probe_B task.label_key=labels3_teacher
name: seg_a
stage: 1
model: seg_a
use_rgb: true
freeze_encoder: true
pretrained_encoder: checkpoints/mae/best.pt

# 3-class contract: 0 ground, 1 building, 2 other
class_names: {0: Ground, 1: Building, 2: Other}
label_collapse: {0: 0, 5: 0, 7: 0, 10: 0, 2: 1, 3: 1, 1: 2, 4: 2, 6: 2, 8: 2, 9: 2, 11: 2, 12: 2}
label_key: null            # null -> real labels (collapsed); "labels3_teacher" -> teacher sidecars
ckpt_metric: building_iou

loss:
  type: focal
  gamma: 2.0
  weight_method: sqrt_inverse_freq
  building_boost: 1.0
  building_class: 1

optimizer:
  type: adamw
  encoder_lr: 2e-5
  head_lr: 2e-4
  weight_decay: 0.01

scheduler:
  type: cosine
  warmup_epochs: 3

epochs: 30
early_stopping_patience: 10
batch_size: 4
max_batch_points: 200000
